name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.19.0, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install required workspace tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Run regression suite
        run: npm test

      - name: Verify backup crash before publication
        run: node scripts/probe-backup-publication-crash.mjs

      - name: Verify distributable package
        run: npm pack --dry-run

      - name: Install and execute the production package
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -rf "$install_root"' EXIT
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          npm pack --ignore-scripts --pack-destination "$install_root" --silent
          npm install --prefix "$install_root/prefix" --omit=dev --no-audit --no-fund \
            "$install_root/$package_name-$package_version.tgz"
          "$install_root/prefix/node_modules/.bin/evidra" --version
          "$install_root/prefix/node_modules/.bin/evidra" --help >/dev/null
          node scripts/probe-installed-modal-worker.mjs "$install_root/prefix/node_modules/$package_name"
          mkdir -p "$install_root/workspace"
          (
            cd "$install_root/workspace"
            EVIDRA_STATE_DIR="$install_root/state" \
              "$install_root/prefix/node_modules/.bin/evidra" init local-research
            EVIDRA_STATE_DIR="$install_root/state" \
              "$install_root/prefix/node_modules/.bin/evidra" status
          )
